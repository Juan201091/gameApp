<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% block title %}
    <title>Document</title>
    {% endblock %}

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    />
  </head>
  <body class="bg-dark">
    {% block content %} {% endblock %}
  </body>
</html>
